<!DOCTYPE html>
<html>
<head>
	<style type="text/css">
		
	.pics{

		width:200px;
		height:200px;
		background-color:white;
		display:inline-block;
		margin:5px;
		background-size:contain;
		background-repeat: no-repeat;
}
		
	</style>
</head>
<body>

<script type="text/javascript">

let counter = 0;

function makeHarryHairy (){
	counter=counter+1

let pic = document.createElement("div")
document.body.appendChild(pic)
pic.classList.add("pics")
pic.style.backgroundImage="url(./harry/"+counter+".jpg)"
}

setInterval(makeHarryHairy, 1000)
</script>

</body>
</html>
