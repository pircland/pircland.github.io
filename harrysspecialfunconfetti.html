<!DOCTYPE html>

<body>

<style type="text/css">
	.newtsconfetti{
		background-color:powderblue;
		position: absolute;
	}
</style>

<script type="text/javascript">
function newtTime(){
	let newtssprinkle = document.createElement("div")
	document.body.appendChild(newtssprinkle)
	newtssprinkle.classList.add("newtsconfetti")
	newtssprinkle.style.height=10+"px"
	newtssprinkle.style.width=5+"px"
	newtssprinkle.style.top=Math.random()*1+"px"
	newtssprinkle.style.left=Math.random()*2000+"px"

	function letnewtsprinkle (){
		newtssprinkle.style.top=parseInt(newtssprinkle.style.top)+(Math.random()+"px")
	}


setInterval(letnewtsprinkle, 200)


} //end of newtime function// 

for(let i=0; i<5000; i=i+1){
	newtTime()
}
</script>

</body>
</html>
