<!DOCTYPE html>
<html>
<head>
<style type="text/css">

#squared{
	position:relative;
	width:100px;
	height:100px;
	background-color:moccasin;
	animation-name:move;
	animation-duration:25s;
	animation-iteration-count:1;

}

@keyframes move{

0%{top:0px;
	left:0px;}
10%{top:800px;
	left:1200px;}
20%{top:1000px;
	left:1000px;}
30%{top:0px;
	left:400px;}
40%{top:300px;
	left:0px}
50%{top:1000px;
	left:800px;}
60%{top:0px;
	left:200px}
70%{top:500px;
	left:1000px;}
80%{top:1000px;
	left:600px;}
90%{top:500px;
	left:300px;}
100%{top:0px;
	left:0px}

}

}

</style>
</head>
<body>

<div id= "squared"> </div>

</body>
</html>
