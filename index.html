.tastyalmonds{
	width:100%;
	height:100%;
	background-position:center;

	background-repeat: no-repeat;
	background-color:white;
	background-size:contain;
	display:inline-block;

}

.leaves{
		width:400px;
		height:200px;
		background-position:center;
/*		position:absolute;*/
		background-image:url(goodleaf2.png);
		background-size:contain;
		display:inline-block;
		background-repeat: no-repeat;
/*		animation-name:fall;*/
		position:relative;
		animation-duration:7s;
/	top:1000px;
	}

	@keyframes fall{

		0%{top:0px;
			left:0px}
		12.5%{top:50px;
			left:100;}
		25%{top:75px;
			left:80px}
		37.5%{top:100px;
			left:120px}
		50%{top:150px;
			left:80px;}
		62.5%{top:200px;
			left:130px;}
		75%{top:250px;
			left:90px}
		87.5%{top:300px;
			left:125px;}
		100%{top:375px;
			left:80px;}
	}
	
	body{
		margin:0px;
	}

	#background{
		width:100%;
		height:1000px;
	background-image:url(https://img.freepik.com/premium-photo/japanese-autumn-scenery-sunny-maple-forest-super-high-resolution_976492-8073.jpg);
	background-size:cover;

	}

</div>

<script type="text/javascript">

	var counter=0;
	function count (){
		counter=counter+1

		if (counter==1){
		leafFalling(1)

	}

	if (counter==3){
		leafFalling(2)

	}

	 } //end of funciton

	setInterval(count, 2000)

	function leafFalling(x){
		let whatever = document.getElementById("leaf"+x)
		whatever.style.animationName = "fall"

		function bottom (){
			whatever.style.top = "375px"

		}

		setTimeout(bottom, 7000)

	}

	leafFalling(0)
