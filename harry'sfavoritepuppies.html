<!DOCTYPE html>
<html>
<head>
	
<style type="text/css">

</head>
<body>

<div id = "box2"></div>

<script type="text/javascript">
	let dogimages = ["url(newt.jpg)", "url(hagdog.jpg)", "url(newtscousin.jpg)", "url(dogg.jpg)"]
funtimeslever.addEventListener("click", function(){

	let random1 = Math.floor(Math.random()*dogimages.length)
	let random2 = Math.floor(Math.random()*dogimages.length)
	let random3 = Math.floor(Math.random()*dogimages.length)

	box1.style.backgroundImage = dogimages[random1]
	box2.style.backgroundImage = dogimages[random2]
	box3.style.backgroundImage = dogimages[random3]

if(random1==random2&&random2==random3){
	alert("Big supa newt the noseless win! Yippee!")
}

else if(random1==random2){
	alert("Newt is disappointed")
}

else if(random2==random3){
	alert("*Click here to lovingly hug newtscousin*")
}

else if(random1==random3){
	alert("Small sad Newt the noseful loose. Awww!")
}

})


</script>
